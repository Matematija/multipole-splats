[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msplats"
authors = [
    { name = "Matija Medvidovic", email = "matija.medvidovic@gmail.com" },
]
description = "Multipole splats for optimized effective potentials in density functional theory calculations."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["numpy", "scipy", "jax", "equinox", "jaxtyping", "pyscf", "einops"]
requires-python = ">=3.10"
dynamic = ["version"]

[project.optional-dependencies]
dev = ["basedpyright>=1.31", "ruff>=0.6"]

[tool.setuptools]
packages = ["msplats"]

[tool.pyright]
include = ["msplats"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
venvPath = ".."
venv = "venv"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
